name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run package:plugin
      - run: node --test test/package-smoke.mjs
      - name: Publish tested plugin ZIP
        run: node scripts/publish-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
